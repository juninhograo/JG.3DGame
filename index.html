<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D First-Person Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/5.53.0/babylon.min.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="minimapCanvas"></canvas>
    <div id="healthBar">
        <div id="healthFill"></div>
    </div>
    <div id="healthText">Health: 3/3</div>
    <div id="info">
        <h3>3D First-Person Game</h3>
        <p><strong>Controls:</strong> WASD to move, Arrow Keys to look around</p>
    </div>
    <div id="interact-prompt"></div>

    <div id="mission-ui" style="display:none">
        <div id="mission-dialog">
            <h2>&#9770; Elder Thornwood</h2>
            <p id="mission-dialogue-text"></p>
            <div id="mission-list"></div>
            <button id="mission-close-btn" onclick="closeMissionUI()">[ Close ]</button>
        </div>
    </div>

    <div id="mission-status" style="display:none">
        <span id="mission-status-name"></span>
        <span id="mission-status-progress"></span>
    </div>

    <!-- Magic dialogue overlay -->
    <div id="magic-dialogue" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.72); z-index:200; display:none; align-items:flex-end; justify-content:center; padding-bottom:60px; box-sizing:border-box;">
        <div id="magic-dialogue-box" style="background:linear-gradient(135deg,rgba(0,20,60,0.97),rgba(0,60,120,0.97)); border:2px solid #4af; border-radius:10px; padding:28px 36px; max-width:680px; width:90%; color:#cef; font-family:'Segoe UI',sans-serif; font-size:15px; line-height:1.7; box-shadow:0 0 40px rgba(0,150,255,0.4);">
            <div style="font-size:18px; font-weight:bold; color:#7df; margin-bottom:12px;">⚗ Elder Thornwood</div>
            <div id="magic-dialogue-text"></div>
            <div style="margin-top:18px; text-align:right;"><button id="magic-dialogue-btn" style="background:rgba(0,100,200,0.7); color:#cef; border:1px solid #4af; border-radius:5px; padding:8px 22px; font-size:14px; cursor:pointer; font-family:inherit;">[ Continue ]</button></div>
        </div>
    </div>

    <!-- Water slash HUD indicator -->
    <div id="waterslash-hud" style="display:none; position:fixed; bottom:18px; right:18px; background:rgba(0,20,60,0.85); border:2px solid #4af; border-radius:8px; padding:8px 16px; color:#7df; font-family:'Segoe UI',sans-serif; font-size:13px; z-index:100;">
        <span style="color:#4cf; font-weight:bold;">Q</span> — Water Slash <span id="waterslash-cooldown-text"></span>
    </div>

    <!-- Wind slash HUD indicator -->
    <div id="windslash-hud" style="display:none; position:fixed; bottom:56px; right:18px; background:rgba(10,30,20,0.88); border:2px solid #aef; border-radius:8px; padding:8px 16px; color:#cff; font-family:'Segoe UI',sans-serif; font-size:13px; z-index:100;">
        <span style="color:#aef; font-weight:bold;">R</span> — Wind Slash <span id="windslash-cooldown-text"></span>
    </div>

    <!-- Fire slash HUD indicator -->
    <div id="fireslash-hud" style="display:none; position:fixed; bottom:94px; right:18px; background:rgba(40,10,0,0.88); border:2px solid #f84; border-radius:8px; padding:8px 16px; color:#fca; font-family:'Segoe UI',sans-serif; font-size:13px; z-index:100;">
        <span style="color:#f84; font-weight:bold;">Hold E</span> — Fire Slash <span id="fireslash-cooldown-text"></span>
    </div>

    <!-- Dark energy HUD indicator -->
    <div id="darkenergy-hud" style="display:none; position:fixed; bottom:132px; right:18px; background:rgba(20,0,40,0.92); border:2px solid #d8f; border-radius:8px; padding:8px 16px; color:#e8f; font-family:'Segoe UI',sans-serif; font-size:13px; z-index:100;">
        <span style="color:#d8f; font-weight:bold;">Hold F</span> — Dark Energy <span id="darkenergy-cooldown-text"></span>
    </div>

    <!-- Wind revelation dialogue overlay -->
    <div id="wind-dialogue" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); z-index:200; align-items:flex-end; justify-content:center; padding-bottom:60px; box-sizing:border-box;">
        <div style="background:linear-gradient(135deg,rgba(5,25,15,0.97),rgba(10,55,40,0.97)); border:2px solid #aef; border-radius:10px; padding:28px 36px; max-width:700px; width:90%; color:#dff; font-family:'Segoe UI',sans-serif; font-size:15px; line-height:1.7; box-shadow:0 0 40px rgba(150,255,200,0.3);">
            <div style="font-size:18px; font-weight:bold; color:#aff; margin-bottom:12px;">🌬 Elder Thornwood &amp; the Elf King</div>
            <div id="wind-dialogue-text"></div>
            <div style="margin-top:18px; text-align:right;"><button id="wind-dialogue-btn" style="background:rgba(30,120,80,0.7); color:#dff; border:1px solid #aef; border-radius:5px; padding:8px 22px; font-size:14px; cursor:pointer; font-family:inherit;">[ Continue ]</button></div>
        </div>
    </div>

    <!-- Fire dragon dialogue overlay -->
    <div id="fire-dialogue" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.78); z-index:200; align-items:flex-end; justify-content:center; padding-bottom:60px; box-sizing:border-box;">
        <div style="background:linear-gradient(135deg,rgba(40,10,0,0.97),rgba(80,25,0,0.97)); border:2px solid #f84; border-radius:10px; padding:28px 36px; max-width:700px; width:90%; color:#fca; font-family:'Segoe UI',sans-serif; font-size:15px; line-height:1.7; box-shadow:0 0 40px rgba(255,100,0,0.4);">
            <div style="font-size:18px; font-weight:bold; color:#fa6; margin-bottom:12px;">🔥 An Inferanoth — Fire Dragon</div>
            <div id="fire-dialogue-text"></div>
            <div style="margin-top:18px; text-align:right;"><button id="fire-dialogue-btn" style="background:rgba(160,40,0,0.7); color:#fca; border:1px solid #f84; border-radius:5px; padding:8px 22px; font-size:14px; cursor:pointer; font-family:inherit;">[ Continue ]</button></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
